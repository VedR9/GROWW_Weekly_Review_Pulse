name: Weekly Review Pulse Pipeline

on:
  schedule:
    # 4:30 AM UTC is 10:00 AM IST on Sundays
    - cron: '30 4 * * 0'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  run-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run E2E Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
          PYTHONPATH: phases/phase-01-data-and-compliance:phases/phase-02-pulse-generation:phases/phase-03-mcp-workspace
        run: |
          python phases/phase-04-e2e-and-operations/e2e_runner.py
